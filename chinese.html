<style>
:root{--bg:#f8f5ff;--ink:#21182f;--muted:#786e83;--purple:#7c3aed;--line:#e6ddf1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","PingFang SC","Helvetica Neue",Arial,sans-serif}
main{max-width:900px;margin:auto;padding:32px 16px 56px}.ey{font-size:12px;font-weight:800;letter-spacing:.13em;color:var(--purple)}

.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:white;font-size:16px}

.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;min-height:170px;box-shadow:0 7px 24px rgba(55,30,80,.05)}

.zh{font-size:29px;font-weight:750;margin-top:12px;line-height:1.15}.py{font-size:15px;font-weight:600;color:var(--purple);margin-top:5px;line-height:1.4}

.nav-switch{display:flex;gap:8px;margin:0 0 18px;position:sticky;top:8px;z-index:20;
background:rgba(248,245,255,.88);backdrop-filter:blur(12px);padding:8px;border:1px solid var(--line);
border-radius:16px;box-shadow:0 6px 20px rgba(55,30,80,.06)}
.nav-switch a{flex:1;text-align:center;text-decoration:none;padding:10px 9px;border-radius:11px;
font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.nav-switch a.active{background:var(--ink);color:#fff}
.nav-switch a:not(.active){background:#fff;color:var(--purple,#7357ff)}
</style></head>
