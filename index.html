<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>INFINIX Interview Flashcards — Alice</title>
<style>
:root{--bg:#f7f5ff;--card:#fff;--ink:#17151f;--muted:#706b7d;--violet:#7357ff;--soft:#eeeaff;--line:#e6e0f5}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:linear-gradient(180deg,#f1edff,#faf9ff);color:var(--ink);min-height:100vh}
.app{max-width:780px;margin:auto;padding:28px 18px 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--violet)}h1{font-size:24px;margin:4px 0 0}.count{font-size:13px;color:var(--muted);white-space:nowrap}
.progress{height:6px;background:#e8e4f2;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:var(--violet);transition:.25s}
.index{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:22px;padding:12px;margin-bottom:16px;box-shadow:0 10px 30px rgba(55,40,110,.06)}.index-title{font-size:12px;font-weight:800;color:var(--muted);padding:4px 6px 10px}.index-list{display:grid;gap:7px;max-height:310px;overflow:auto;padding:1px}.index-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;box-shadow:none;border:1px solid var(--line);border-radius:13px;padding:11px 12px;font-weight:700}.index-btn .num{flex:0 0 28px;height:28px;border-radius:9px;background:var(--soft);color:var(--violet);display:grid;place-items:center;font-size:12px}.index-btn .label{font-size:13px;line-height:1.3}.index-btn.active{border-color:var(--violet);background:var(--soft)}
.scene{perspective:1200px}.card{position:relative;min-height:430px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 18px 50px rgba(55,40,110,.10);display:flex;flex-direction:column}.back{transform:rotateY(180deg)}
.tag{font-size:12px;font-weight:800;color:var(--violet);text-transform:uppercase;letter-spacing:.08em}.q{font-size:30px;line-height:1.18;font-weight:800;margin:auto 0}.hint{font-size:14px;color:var(--muted);margin-top:auto}.answer{font-size:18px;line-height:1.6;margin:18px 0}.answer p{margin:0 0 14px}.keys{margin-top:auto;padding:14px 16px;background:var(--soft);border-radius:16px;font-size:14px;line-height:1.5}.cn{font-size:13px;color:var(--muted);margin-top:10px}
.controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:18px}button{border:0;border-radius:16px;padding:15px 10px;font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(40,30,80,.06)}button.primary{background:var(--violet);color:#fff}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}@media(max-width:520px){.app{padding:20px 14px 28px}.card{min-height:500px}.face{padding:24px}.q{font-size:27px}.answer{font-size:16px}.top{align-items:start}.controls{grid-template-columns:1fr 1.35fr 1fr}}
</style>
</head>
<body><main class="app">
<div class="top"><div><div class="eyebrow">ALICE · 陈翼飞</div><h1>INFINIX Interview Cards</h1></div><div class="count" id="count"></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="index"><div class="index-title">เลือกคำถาม — กวาดสายตาแล้วกดเปิดได้เลย</div><div class="index-list" id="indexList"><button class="index-btn" type="button" onclick="goCard(0)"><span class="num">1</span><span class="label">Tell me about yourself.</span></button><button class="index-btn" type="button" onclick="goCard(1)"><span class="num">2</span><span class="label">Why are you interested in this role?</span></button><button class="index-btn" type="button" onclick="goCard(2)"><span class="num">3</span><span class="label">Your recent experience is B2B. What about B2C?</span></button><button class="index-btn" type="button" onclick="goCard(3)"><span class="num">4</span><span class="label">Tell me about a project you managed.</span></button><button class="index-btn" type="button" onclick="goCard(4)"><span class="num">5</span><span class="label">How do you manage marketing?</span></button><button class="index-btn" type="button" onclick="goCard(5)"><span class="num">6</span><span class="label">How would you launch a new Infinix product?</span></button><button class="index-btn" type="button" onclick="goCard(6)"><span class="num">7</span><span class="label">Give me an actual product launch idea.</span></button><button class="index-btn" type="button" onclick="goCard(7)"><span class="num">8</span><span class="label">Give me a gaming launch idea for Infinix.</span></button><button class="index-btn" type="button" onclick="goCard(8)"><span class="num">9</span><span class="label">How would you turn a partnership into an activation?</span></button><button class="index-btn" type="button" onclick="goCard(9)"><span class="num">10</span><span class="label">What if gaming is the key selling point?</span></button><button class="index-btn" type="button" onclick="goCard(10)"><span class="num">11</span><span class="label">How do you think about brand collaboration?</span></button><button class="index-btn" type="button" onclick="goCard(11)"><span class="num">12</span><span class="label">How do you work with HQ and localization?</span></button><button class="index-btn" type="button" onclick="goCard(12)"><span class="num">13</span><span class="label">What if you disagree with HQ?</span></button><button class="index-btn" type="button" onclick="goCard(13)"><span class="num">14</span><span class="label">How hands-on are you with creative?</span></button><button class="index-btn" type="button" onclick="goCard(14)"><span class="num">15</span><span class="label">How do you work with PR?</span></button><button class="index-btn" type="button" onclick="goCard(15)"><span class="num">16</span><span class="label">How do you use AI?</span></button><button class="index-btn" type="button" onclick="goCard(16)"><span class="num">17</span><span class="label">How do you handle a messy brief?</span></button><button class="index-btn" type="button" onclick="goCard(17)"><span class="num">18</span><span class="label">How do you manage multiple priorities?</span></button><button class="index-btn" type="button" onclick="goCard(18)"><span class="num">19</span><span class="label">How do you measure performance?</span></button><button class="index-btn" type="button" onclick="goCard(19)"><span class="num">20</span><span class="label">Why did you leave ZWSOFT?</span></button><button class="index-btn" type="button" onclick="goCard(20)"><span class="num">21</span><span class="label">What are your strengths?</span></button><button class="index-btn" type="button" onclick="goCard(21)"><span class="num">22</span><span class="label">What is your salary expectation?</span></button><button class="index-btn" type="button" onclick="goCard(22)"><span class="num">23</span><span class="label">What do you want to ask the interviewer?</span></button></div></div>
<div class="scene"><div class="card" id="card"><section class="face front"><div class="tag" id="tag"></div><div class="q" id="q"></div><div class="hint">แตะบัตรเพื่อเปิดคำตอบ</div></section><section class="face back"><div class="tag">ANSWER</div><div class="answer" id="a"></div><div class="keys" id="keys"></div><div class="cn" id="cn"></div></section></div></div>
<div class="controls"><button id="prev">← ก่อนหน้า</button><button class="primary" id="flip">เปิดคำตอบ</button><button id="next">ถัดไป →</button></div>
<div class="footer">กดหัวข้อด้านบนเพื่อกระโดดไปคำถามนั้น · แตะบัตรเพื่อเปิดคำตอบ · ← → เปลี่ยนข้อ</div>
</main>
<script>
const cards=[
{tag:'INTRO',q:'Tell me about yourself.',a:`<p>Hi, I’m Alice. My Thai nickname is <b>Gyokoi</b>, my English name is <b>Alice</b>, and <b>我的中文名字是陈翼飞</b>.</p><p>I graduated in International Business with a focus on China and also studied in China, including Guangzhou.</p><p>After graduation, I moved into marketing, mainly in technology and digital businesses. In recent roles, I’ve moved more into <b>marketing management</b>, while staying hands-on with digital, PR, content and creative work.</p><p>I’ve also worked closely with Chinese and international teams, and recently I’ve been using UX/UI and AI-assisted development to improve marketing workflows.</p>`,keys:'China → Marketing → Management + Hands-on → HQ/Local → AI',cn:'我的中文名字是陈翼飞 · Wǒ de Zhōngwén míngzi shì Chén Yìfēi'},
{tag:'MOTIVATION',q:'Why are you interested in this role?',a:`<p>I’ve wanted to move further into consumer marketing while still staying on the marketing management side.</p><p>I like that this role combines campaigns, PR, creative projects and brand collaboration. I’m also interested in the HQ-local side because I already have experience working with Chinese and international teams.</p>`,keys:'B2C + Marketing Management + HQ'},
{tag:'B2C',q:'Your recent experience is B2B. What about B2C?',a:`<p>My recent corporate experience is more B2B, but I already have a B2C and e-commerce foundation.</p><p>I’ve worked with e-commerce, consumer-tech projects involving Apple, HP and Lenovo, and I’ve built consumer-facing businesses and systems myself.</p><p><b>B2C is an expansion, not a reset.</b></p>`,keys:'Proof if asked: 8baht · Lenovo · Apple · HP · Phone Rental · Meesook · Car Booking',cn:'消费者 xiāofèizhě · 电商 diànshāng'},
{tag:'HERO PROJECT',q:'Tell me about a project you managed.',a:`<p>I managed the marketing side of the GstarSolutions Product Launch Thailand, including strategy, communication, budget, PR, digital marketing, creative direction, partners, sponsorship and execution.</p><p>I also developed the sponsorship plan and secured around <b>THB 360,000</b> from partners.</p><p>So I wasn’t only managing the event. I was managing the overall marketing around the launch.</p>`,keys:'Strategy → Budget → Communication → Execution → 360K',cn:'预算 yùsuàn · 赞助 zànzhù'},
{tag:'MANAGEMENT',q:'How do you manage marketing?',a:`<p>I normally start from the business objective, then work down into strategy, budget, communication, resources and execution.</p><p>I stay hands-on where it makes sense, but I also look at what I should own, what the team can handle and when we need a specialist.</p>`,keys:'Budget = strategic resource, not just a spending limit.'},
{tag:'LIVE CASE',q:'How would you launch a new Infinix product?',a:`<p><b>Let me structure my thinking first.</b></p><p>First, I’d understand the product, the target consumer and what we want to achieve.</p><p>Then I’d find the strongest reason for the consumer to care and build the campaign around that.</p><p>After that, I’d think about how to make them notice the product, believe the message, experience it and eventually consider buying it — then choose the right channels for each stage.</p>`,keys:'What are we selling? · Who are we selling to? · Why would they care? → Notice → Believe → Experience → Buy'},
{tag:'PRODUCT IDEA',q:'Give me an actual product launch idea.',a:`<p>I’d build the idea around the product’s strongest reason to buy, rather than starting from a channel.</p><p>If gaming is the hero, I’d work with the gaming ecosystem — esports teams, players, tournaments, creators or communities — and let people actually use the device.</p><p>If the hero is camera, design, value or AI, I’d change the idea around that strength and build the consumer experience from there.</p>`,keys:'Strongest product benefit → Real experience → Content / PR / Community / Conversion'},
{tag:'GAMING LAUNCH',q:'Give me a gaming launch idea for Infinix.',a:`<p>I’d rather make the phone part of the gaming experience than only advertise the specs.</p><p>For example, partner with an esports team or tournament and have professional players actually use the device. That creates real product proof.</p><p>Then extend the partnership into player content, PR, fan activities and product trials.</p>`,keys:'Actual player use → Product proof → Content → PR → Fan experience'},
{tag:'COLLAB CASE',q:'How would you turn a partnership into an activation?',a:`<p>I’d start with <b>what can we give them, and what can they give us?</b></p><p>Then I’d find a role for the product inside the experience — not just logo exposure.</p><p>From that one partnership, I’d try to create product proof, content, PR, community engagement and a path to conversion.</p>`,keys:'Give ↔ Get → Product role → Amplify → Conversion'},
{tag:'GAMING',q:'What if gaming is the key selling point?',a:`<p>I’d look at the gaming ecosystem, not only product advertising.</p><p>We could work with esports teams, players, tournaments or gaming communities. If professional players actually use the device, the product itself becomes proof.</p><p>Then we can extend that into content, PR and community engagement.</p>`,keys:'Real usage → Product proof → Content / PR / Community',cn:'电竞 diànjìng · 职业选手 zhíyè xuǎnshǒu'},
{tag:'COLLAB',q:'How do you think about brand collaboration?',a:`<p>I always start with: <b>what can we give them, and what can they give us?</b></p><p>I don’t want a collaboration to be only logo exposure. I prefer something where both sides bring real value and the product becomes part of the experience.</p>`,keys:'Give ↔ Get → Product becomes part of the experience',cn:'品牌合作 pǐnpái hézuò · 价值交换 jiàzhí jiāohuàn'},
{tag:'HQ / LOCAL',q:'How do you work with HQ and localization?',a:`<p>My advantage isn’t only the language. I’m used to working across different cultures.</p><p>With HQ, I first understand the objective and why they want something. Then I think about how to make it work in Thailand.</p><p><b>Localization is not just translation. We keep the core objective, but adapt the execution.</b></p>`,keys:'Understand WHY → Keep objective → Adapt execution',cn:'总部 zǒngbù · 本地化 běndìhuà · 跨文化沟通 kuà wénhuà gōutōng'},
{tag:'HQ / LOCAL',q:'What if you disagree with HQ?',a:`<p>I’d explain the local context and support my view with data, consumer insight or market examples if possible.</p><p>But I wouldn’t only say something won’t work. I’d bring an alternative that can still achieve the same objective.</p>`,keys:'Context → Evidence → Alternative'},
{tag:'CREATIVE',q:'How hands-on are you with creative?',a:`<p>I’m quite hands-on. I can create or edit artwork myself, especially for urgent work, social content or AI-assisted content.</p><p>For bigger production or specialist work, I work with designers, agencies or vendors.</p><p>I can do it myself when it makes sense, but I also know when to delegate.</p>`,keys:'Do it when useful · Delegate when smarter'},
{tag:'PR',q:'How do you work with PR?',a:`<p>I’m quite hands-on with PR. I usually start with the story — why should the media or audience care?</p><p>Then I work on the message, PR material, media selection, outreach and follow-up, and connect PR with the overall campaign.</p>`,keys:'PR starts with the story, not the press release.',cn:'公关 gōngguān · 媒体 méitǐ'},
{tag:'AI',q:'How do you use AI?',a:`<p>I use AI across my workflow — research, analysis, content, localization and reporting.</p><p>I also use AI-assisted development to build websites, dashboards, prototypes and internal tools.</p><p>The main value for me is <b>reducing time and improving efficiency.</b></p>`,keys:'Coding is not the goal. Solve marketing/workflow problems faster.',cn:'效率 xiàolǜ'},
{tag:'PROJECT',q:'How do you handle a messy brief?',a:`<p>I first clarify the objective, priorities and what still needs a decision.</p><p>Then I organize the timeline, responsibilities and next actions so everyone knows what needs to happen.</p>`,keys:'Objective → Priority → Timeline → Responsibility → Next action'},
{tag:'PROJECT',q:'How do you manage multiple priorities?',a:`<p>I normally look at <b>impact, deadline and dependency</b> — what matters most, what has a fixed deadline and what other people are waiting for.</p>`,keys:'Impact → Deadline → Dependency'},
{tag:'PERFORMANCE',q:'How do you measure performance?',a:`<p>It depends on the objective. I look at the relevant results, whether that’s awareness, engagement, traffic or conversion.</p><p>I also want to understand why it worked or didn’t work, and what we should change next time.</p>`,keys:'Result → Why → Next action',cn:'复盘 fùpán'},
{tag:'ZWSOFT',q:'Why did you leave ZWSOFT?',a:`<p>It wasn’t performance-related, and my work was actually well received by the team.</p><p>I realized quite early that the long-term direction of the role wasn’t aligned with the broader marketing direction I want, so I decided it was better to make the decision early.</p>`,keys:'If asked: broader ownership across strategy, campaigns, brand and communication.'},
{tag:'STRENGTHS',q:'What are your strengths?',a:`<p>I’d say <b>marketing management, being hands-on and cross-cultural communication.</b></p><p>I can look at the overall strategy and project, but I can also go into execution when needed.</p>`,keys:'Management · Hands-on · Cross-cultural'},
{tag:'SALARY',q:'What is your salary expectation?',a:`<p>Based on the full scope of the role, my current expectation is around <b>THB 80,000</b>, but I’m open to discussing the overall package.</p><p>If asked about 65K: I shared that before I had the complete scope. After reviewing the responsibilities, I adjusted my expectation.</p>`,keys:'80K = 八万 bā wàn'},
{tag:'ASK THEM',q:'What do you want to ask the interviewer?',a:`<p>1. How is this role positioned within the marketing team?</p><p>2. How is the work divided within the marketing team?</p><p>3. Are there opportunities for this role to work with the HQ team in China in person?</p><p>4. What is the career path for this role?</p>`,keys:'ROLE → TEAM → CHINA → CAREER'}
];
let i=0;const card=document.querySelector('#card'),q=document.querySelector('#q'),a=document.querySelector('#a'),tag=document.querySelector('#tag'),keys=document.querySelector('#keys'),cn=document.querySelector('#cn'),count=document.querySelector('#count'),bar=document.querySelector('#bar'),flip=document.querySelector('#flip'),indexList=document.querySelector('#indexList');
function goCard(n){i=n;render();document.querySelector('.scene').scrollIntoView({behavior:'smooth',block:'start'})} function buildIndex(){}
function render(){card.classList.remove('flip');const c=cards[i];q.textContent=c.q;a.innerHTML=c.a;tag.textContent=c.tag;keys.textContent=c.keys||'';cn.textContent=c.cn||'';count.textContent=`${i+1} / ${cards.length}`;bar.style.width=`${(i+1)/cards.length*100}%`;flip.textContent='เปิดคำตอบ';document.querySelectorAll('.index-btn').forEach((b,n)=>b.classList.toggle('active',n===i))}
function doFlip(){card.classList.toggle('flip');flip.textContent=card.classList.contains('flip')?'ดูคำถาม':'เปิดคำตอบ'}
card.onclick=doFlip;flip.onclick=doFlip;document.querySelector('#prev').onclick=()=>{i=(i-1+cards.length)%cards.length;render()};document.querySelector('#next').onclick=()=>{i=(i+1)%cards.length;render()};document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();doFlip()}if(e.key==='ArrowRight'){i=(i+1)%cards.length;render()}if(e.key==='ArrowLeft'){i=(i-1+cards.length)%cards.length;render()}});buildIndex();render();
</script></body></html>
